[project]
name = "gitmatrix"
description = "Un client Git visuel et léger"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.5.0",
    "GitPython>=3.1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
gitmatrix = "gitmatrix.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gitmatrix.__version__"}

[tool.setuptools.package-data]
gitmatrix = ["*.qss"]
